<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Túrabakancs">
  <!-- A védjegy vonala négyzetben nem fér el laposan: az ikon a tömör,
       meredekebb változatot kapja. Ugyanaz a jel — üreges rajtpont,
       tömör célpont —, csak összefogva.

       A rajtpont sugara + a vonalvastagság fele = a célpont sugara, hogy a
       kettő azonos súlyúnak látsszon. Enélkül a gyűrű nehezebb. -->
  <rect width="32" height="32" rx="7" fill="#F4F2ED"/>
  <path d="M7.6 24.6C11.4 22.3 9.8 19.2 13.6 17.1C17.4 15 15.8 11.5 19.6 9.4C21.4 8.4 23 7.6 24.6 6.8"
        fill="none" stroke="#2F5D3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="7.6" cy="24.6" r="2.15" fill="#F4F2ED" stroke="#2F5D3A" stroke-width="1.7"/>
  <circle cx="24.6" cy="6.8" r="3" fill="#9B6B15"/>
</svg>
